name: "Bug Report"
description: "버그 리포트 템플릿"
title: "[BUG]: "
labels: ["bug"]
body:
  - type: textarea
    attributes:
      label: 🐛 버그 설명
      description: 발생한 버그에 대해 명확하고 간결하게 설명해주세요.
      placeholder: 예약 내역 조회 시 500 에러가 발생합니다.
    validations:
      required: true

  - type: textarea
    attributes:
      label: 🔄 재현 방법
      description: 버그를 재현할 수 있는 단계를 작성해주세요.
      placeholder: |
        1. 로그인 후 마이페이지 접속
        2. 예약 내역 메뉴 클릭
        3. 500 에러 발생
    validations:
      required: true

  - type: textarea
    attributes:
      label: ✅ 예상 동작
      description: 정상적으로 작동했을 때 어떻게 동작해야 하는지 설명해주세요.
      placeholder: 예약 내역 목록이 정상적으로 표시되어야 합니다.
    validations:
      required: true

  - type: textarea
    attributes:
      label: ❌ 실제 동작
      description: 실제로 어떻게 동작하는지 설명해주세요.
      placeholder: 500 서버 에러가 발생하고 예약 내역을 불러올 수 없습니다.
    validations:
      required: true

  - type: textarea
    attributes:
      label: 📸 스크린샷 / 로그
      description: 버그를 설명하는 스크린샷이나 에러 로그를 첨부해주세요.
      placeholder: |
        에러 메시지나 스크린샷을 붙여넣으세요.
        ```
        에러 로그
        ```

  - type: textarea
    attributes:
      label: 🔍 원인 분석 (선택)
      description: 버그의 원인을 파악했다면 작성해주세요.
      placeholder: BookingQueryServiceImpl.getBookingList() 메서드에 @Transactional 어노테이션이 누락되어 있습니다.

  - type: textarea
    attributes:
      label: 🙋🏻 참고 자료
      description: 관련된 참고 자료나 추가 정보가 있다면 작성해주세요.
      placeholder: 관련 API 문서, 스택 오버플로우 링크 등
